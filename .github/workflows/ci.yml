# Build and test dpc on Linux x86_64 and macOS, and attach a release build
# of the compiler (with the m68k runtime beside it, the layout
# `dpc --print-runtime' expects) as a workflow artifact.
#
# The m68k-elf binutils are installed so that `make build' assembles the
# runtime and the Python tool tests that assemble (tools/dispcheck.py,
# tools/linktest.py) run instead of skipping.  The parts of `make test'
# that need the SR10.2 image, the install or Musashi skip with a notice,
# as they do on any machine without them; `make snapshot' (in `make
# test') still checks dpc's output for those suites' programs against
# tests/snapshots/ (tests/snapshots/README.md), with nothing from outside
# this repository.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The m68k-elf binutils built on Linux (below); macOS takes Homebrew's.
  BINUTILS_VERSION: 2.45.1
  BINUTILS_SHA256: 5fe101e6fe9d18fdec95962d81ed670fdee5f37e3f48f0bef87bddf862513aa5

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Ubuntu packages the m68k binutils only for the m68k-linux-gnu
      # target.  Its assembler leaves a branch to a global symbol to the
      # linker (a Linux symbol may be preempted) and cannot fit that in a
      # bsr.s: `bsr.s M$DIU$LLL' in runtime/m68k/m_arith.s fails, and so
      # would dpc's own bsr.s calls of a module's exported routines.  The
      # bare-metal m68k-elf assembler, which ../source and dpc's tools use,
      # resolves them.  So Linux builds m68k-elf binutils from GNU's
      # release (checksum pinned above), cached across runs.
      - name: Cache m68k-elf binutils (Linux)
        if: runner.os == 'Linux'
        id: binutils-cache
        uses: actions/cache@v4
        with:
          path: ~/m68k-elf
          key: m68k-elf-binutils-${{ env.BINUTILS_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build m68k-elf binutils (Linux)
        if: runner.os == 'Linux' && steps.binutils-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o binutils.tar.xz \
            "https://ftpmirror.gnu.org/binutils/binutils-$BINUTILS_VERSION.tar.xz"
          echo "$BINUTILS_SHA256  binutils.tar.xz" | sha256sum -c -
          tar -xf binutils.tar.xz
          mkdir build && cd build
          "../binutils-$BINUTILS_VERSION/configure" --target=m68k-elf \
            --prefix="$HOME/m68k-elf" --disable-nls --disable-werror \
            --disable-gprofng MAKEINFO=true
          make -j"$(nproc)" MAKEINFO=true
          make install MAKEINFO=true

      - name: Install m68k binutils (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "$HOME/m68k-elf/bin" >> "$GITHUB_PATH"
          "$HOME/m68k-elf/bin/m68k-elf-as" --version | head -1

      - name: Install m68k binutils (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install m68k-elf-binutils
          m68k-elf-as --version | head -1

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Release build
        env:
          DPC_COMMIT: ${{ github.sha }}
        run: cargo build --release

      - name: Package
        run: |
          out="dpc-${{ matrix.name }}"
          mkdir -p "$out/bin" "$out/runtime/m68k"
          cp target/release/dpc "$out/bin/dpc"
          cp target/runtime/m68k/libm_arith.a "$out/runtime/m68k/"
          echo "${{ github.sha }}" > "$out/COMMIT"
          "$out/bin/dpc" --version

      - uses: actions/upload-artifact@v4
        with:
          name: dpc-${{ matrix.name }}
          path: dpc-${{ matrix.name }}
          if-no-files-found: error
